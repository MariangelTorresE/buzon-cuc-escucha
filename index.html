<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buzón CUC Escucha</title>

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header>
      <h1>Buzón CUC Escucha</h1>
      <p>Facultad de Ingeniería - Universidad de la Costa</p>
    </header>

    <main>
      <section class="contenedor">
        <h2>Déjanos tu sugerencia o idea</h2>

        <form>
          <div class="grupo">
            <label for="nombre">Nombre completo</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Ej. Laura Gómez"
              required
            />
          </div>

          <div class="grupo">
            <label for="telefono">Teléfono</label>
            <input
              type="tel"
              id="telefono"
              name="telefono"
              placeholder="300 123 4567"
              required
            />
          </div>

          <div class="grupo">
            <label for="correo">Correo electrónico</label>
            <input
              type="email"
              id="correo"
              name="correo"
              placeholder="correo@cuc.edu.co"
              required
            />
          </div>

          <div class="grupo">
            <label for="servicio">Categoría de la sugerencia</label>

            <select id="servicio" name="servicio" required>
              <option value="">Seleccione una opción</option>
              <option value="bienestar">Bienestar y Servicios</option>
              <option value="academico">Clases y Procesos Académicos</option>
              <option value="infraestructura">
                Espacios e Infraestructura
              </option>
              <option value="inclusion">Inclusión y Diversidad</option>
              <option value="otro">Otra opción</option>
            </select>
          </div>

          <div class="grupo">
            <label for="fecha">Fecha de envío</label>
            <input type="date" id="fecha" name="fecha" required />
          </div>

          <div class="grupo">
            <label for="mensaje">Detalle de tu sugerencia o idea</label>

            <textarea
              id="mensaje"
              name="mensaje"
              rows="4"
              placeholder="Escribe aquí tu sugerencia para mejorar la Facultad..."
              required
            >
            </textarea>
          </div>

          <button type="submit">Enviar sugerencia</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Universidad de la Costa | Facultad de Ingeniería © 2026</p>
    </footer>
  </body>
</html>
